<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>mfe-profile (standalone dev)</title>
    <!-- Same import map as the host, so the external @platform/sdk resolves. -->
    <script type="importmap">
      { "imports": { "@platform/sdk": "/platform/sdk/1.0.0/sdk.js" } }
    </script>
  </head>
  <body>
    <!-- Only used for standalone dev of this MFE; the host loads the built bundle.
         No platform context provider here, so contexts render their defaults. -->
    <mfe-profile userId="dev"></mfe-profile>
  </body>
</html>
